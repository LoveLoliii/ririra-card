<!doctype html>
<html lang="zh-CN"><head><link rel="stylesheet" href="./component-styles.css"><link rel="stylesheet" href="./studio.css"><link rel="stylesheet" href="./studio-controls.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玫瑰雨幕 · 3D 闪卡工作台</title>
<style>
:root{color-scheme:dark;--bg:#100e17;--panel:#191620;--line:#ffffff12;--text:#f1e4de;--muted:#a89aa9;--rose:#ddb6aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,input,a{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid var(--line)}.brand{font-size:17px;letter-spacing:2px}.brand small{display:block;font:10px/1.6 Arial;letter-spacing:3px;color:var(--muted)}.badge{font-size:12px;color:#e2c5bb;border:1px solid #d6aea32b;border-radius:30px;padding:5px 13px}.badge:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#b6d5b8;margin-right:8px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 302px;gap:0;max-width:1500px;margin:auto;min-height:calc(100dvh - 78px)}.viewer{min-height:650px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#302434 0%,#1b1523 42%,#100e17 75%)}#canvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none;cursor:grab}#canvas:active{cursor:grabbing}.view-note{position:absolute;top:25px;left:30px;font-size:11px;letter-spacing:2px;color:#b7a2af;pointer-events:none}.view-note strong{display:block;color:#e3cec7;font-size:13px;letter-spacing:1px;font-weight:400}.view-hint{position:absolute;bottom:22px;width:100%;text-align:center;color:#a897a8;font-size:12px;pointer-events:none}.loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#100e17dc;z-index:2;color:#d9beb8;letter-spacing:1px}.loading[hidden]{display:none}.loading small{color:#a493a4;margin-top:12px}.loading button{margin:18px auto;border:1px solid #d6aea34d;border-radius:6px;background:#2b2230;color:#efdbd0;padding:8px 20px}.side{padding:32px 25px;border-left:1px solid var(--line);background:linear-gradient(180deg,#191620,#131119);display:flex;flex-direction:column;gap:23px}.eyebrow{font-size:10px;letter-spacing:2px;color:#b997a2}h1{font-size:28px;font-weight:450;letter-spacing:4px;line-height:1.4;margin:9px 0 6px}.subtitle{color:var(--muted);font-size:12px;margin:0}.rule{height:1px;background:var(--line)}.section-label{font-size:12px;color:#d9c7ce;margin-bottom:11px;display:flex;justify-content:space-between}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.presets button,.secondary{border:1px solid #ffffff17;border-radius:6px;background:#ffffff04;color:#c5b5c3;padding:9px 0;transition:background .15s,border-color .15s}.presets button:hover,.secondary:hover{border-color:#d3a79d77;background:#d3a79d14}.presets button.active{border-color:#d3a79d77;color:#efd7ce;background:#d3a79d14}.range-block{margin-top:17px}.range-label{display:flex;justify-content:space-between;font-size:12px;color:#b9a9b8}.range-label output{font-variant-numeric:tabular-nums;color:#e5cbc4}input[type=range]{width:100%;accent-color:var(--rose);height:18px;margin:9px 0 0;cursor:pointer}.toggle{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#c7b6c2;margin:13px 0 0}.toggle input{accent-color:var(--rose);width:16px;height:16px;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{border:1px solid transparent;border-radius:6px;background:#dcb6ab;color:#2b1f28;padding:11px 8px}.secondary{padding:11px 8px}.bottom{margin-top:auto;font-size:11px;color:#8f8091;line-height:1.9}.bottom a{color:#c7a79f;text-decoration:none}.bottom a:hover{text-decoration:underline}.status{color:#bcaab8;font-size:11px;margin:0}.status:before{content:'↔';margin-right:6px;color:#d7b6ab}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #e9b9ab;outline-offset:4px}
@media(min-width:900px){.viewer{height:calc(100dvh - 78px);max-height:1150px}}@media(max-width:899px){header{height:65px;padding:0 20px}.layout{grid-template-columns:minmax(0,1fr) 270px;min-height:calc(100dvh - 65px)}.viewer{height:calc(100dvh - 65px);min-height:590px}.side{padding:25px 19px}.view-note{left:20px}}@media(max-width:650px){header{padding:0 18px}.brand{font-size:15px}.badge{font-size:10px}.layout{display:block}.viewer{height:70dvh;min-height:460px;max-height:730px}.side{border-left:0;border-top:1px solid var(--line);gap:20px;padding:24px}.side h1{font-size:25px}.bottom{margin-top:0}.view-hint{font-size:11px}.view-note{top:18px;font-size:9px}.view-note strong{font-size:11px}}
</style><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head><body>
<header><div class="brand">闪卡工作台<small>CHARACTER CARD ATELIER</small></div><span class="badge">实时 3D 预览</span></header>
<main class="layout"><section class="viewer" aria-label="可拖动的三维卡片"><canvas id="canvas" aria-label="拖动旋转卡片，滚轮缩放" tabindex="0"></canvas><div class="view-note">COLLECTION / 001<strong>玫瑰雨幕 · ROSE IN THE RAIN</strong></div><div class="view-hint">拖动旋转 · 滚轮缩放 · 右键平移</div><div class="loading" id="loading"><span id="loading-label">正在准备角色与卡片…</span><small id="loading-detail">首次加载需要片刻</small><button id="retry" hidden>重新加载</button></div></section>
<aside class="side"><div><span class="eyebrow">PRIVATE COLLECTION / SR</span><h1>玫瑰雨幕</h1><p class="subtitle">原创水晶示例 · 可导入自己的模型</p></div><div class="rule"></div>
<div><div class="section-label">观察角度</div><div class="presets"><button data-view="front" class="active">正面</button><button data-view="left">左侧</button><button data-view="right">右侧</button><button data-view="back">背面</button></div><div class="range-block"><label class="range-label" for="yaw">水平旋转<output id="yaw-value">0°</output></label><input id="yaw" type="range" min="-180" max="180" step="0.1" value="0"></div><div class="range-block"><label class="range-label" for="pitch">俯仰角度<output id="pitch-value">0°</output></label><input id="pitch" type="range" min="-80" max="80" step="0.1" value="0"></div><div class="range-block"><label class="range-label" for="zoom">画面缩放<output id="zoom-value">100%</output></label><input id="zoom" type="range" min="70" max="220" step="1" value="100"></div></div>
<div class="rule"></div><div><div class="section-label">查看细节</div><div class="actions"><button class="secondary" id="face">人物近景</button><button class="secondary" id="reset">复位视角</button></div><label class="toggle">显示网格<input type="checkbox" id="wireframe"></label><label class="toggle">显示卡面<input type="checkbox" id="show-card" checked></label></div>
<div class="rule"></div><button id="save" class="primary">导出当前视角 PNG</button><p class="status" id="status">静止查看 · 拖动即可旋转</p><div class="bottom">本机 3D 闪卡工作台。<br>导入自己的 GLB / glTF，制作并导出卡片。</div></aside></main>
<style>.side{gap:18px;padding-top:26px;padding-bottom:24px}.view-note{top:15px}.range-block{margin-top:14px}.actions{grid-template-columns:repeat(3,1fr);font-size:12px}@media(max-width:650px){.view-note{display:none}}</style>
<script>if(location.protocol==='file:')location.replace('http://127.0.0.1:8773/index-realtime.html');document.querySelector('#zoom').max='1100';const faceButton=document.createElement('button');faceButton.className='secondary';faceButton.id='face-detail';faceButton.textContent='脸部特写';document.querySelector('#face').after(faceButton);</script><script type="module" src="./studio.js"></script></body></html>
